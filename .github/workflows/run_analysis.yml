name: Bond Analysis Bot # 워크플로우 이름 (깃허브 Actions 탭에 표시됨)

on:
  schedule:
    - cron: '7 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # 깃허브가 빌려주는 리눅스 서버에서 실행

    steps:
    - name: Checkout code # 1. 깃허브에 올린 코드를 가상 서버로 가져옴
      uses: actions/checkout@v3

    - name: Set up Python # 2. 파이썬 환경(3.10 버전) 세팅
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies # 3. requirements.txt에 적힌 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Analysis # 4. 드디어 main.py 실행!
      env:
        # 깃허브 Secrets에 저장한 '금고 열쇠'들을 불러와서 환경 변수로 넘겨줌
        BOND_BOT_TOKEN: ${{ secrets.BOND_BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python main.py
